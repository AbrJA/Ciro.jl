<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ciro.jl · AI Chat</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1><span class="bolt">⚡</span> Ciro.jl <em>AI Chat</em></h1>
    <div class="header-right">
      <span id="online" class="pill">— online</span>
      <span id="stream" class="pill">connecting…</span>
      <span id="metrics" class="pill muted">—</span>
    </div>
  </header>

  <main class="layout">
    <aside class="sidebar">
      <h2>Rooms</h2>
      <ul id="rooms"></ul>
      <label class="field">
        Your name
        <input id="name" value="you" spellcheck="false">
      </label>
      <div class="sidebar-actions">
        <a id="transcript" class="link" href="/api/v1/rooms/1/transcript" download>Download transcript</a>
        <button id="import-ok" class="ghost small">Import 100 B</button>
        <button id="import-big" class="ghost small">Import 9 KB → 413</button>
      </div>
      <p id="note" class="note">Open this page in two tabs to see live fan-out.</p>
    </aside>

    <section class="chat">
      <div id="messages" class="messages"></div>
      <div id="typing" class="typing"></div>
      <form id="composer" class="composer" autocomplete="off">
        <input id="text" placeholder="Message the room…" spellcheck="false">
        <button type="submit">Send</button>
      </form>
    </section>
  </main>

  <footer>
    SSE fan-out · assistant runs on the async executor · transcript streams chunked ·
    imports carry a per-route limit and <code>Expect: 100-continue</code>
  </footer>

  <script src="/static/app.js"></script>
</body>
</html>
